# config updates based on https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
set -g mouse on 
#set -g mouse-select-pane on

# include ctrl+a binding
set-option -g prefix C-a
bind-key C-a send-prefix
unbind C-b

# better vertical splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config with r
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

#clock
setw -g clock-mode-colour yellow

# don't rename windows automatically
set-option -g allow-rename off

# Shift+Left/Right to move windows left/right
bind-key -n S-Left swap-window -t -1
bind-key -n S-Right swap-window -t +1

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "cpu-usage ram-usage battery network"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


